name: Vigilar cupos

on:
  schedule:
    # Cada 10 minutos (minutos 3, 13, 23, 33, 43 y 53 de cada hora).
    # Repo público = minutos de Actions ilimitados.
    # Se evita el minuto 0 porque es cuando GitHub tiene más atrasos.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:          # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write             # para guardar estado_cupos.json en el repo

concurrency:
  group: vigilar-cupos        # nunca dos ejecuciones a la vez
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5        # si algo se cuelga, no gasta más de 5 minutos
    steps:
      - uses: actions/checkout@v4

      - name: Revisar cupos
        continue-on-error: true   # el script ya avisa los errores por Discord
        env:
          TZ: America/Santiago    # para que la hora de los mensajes sea la de Chile
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENCION: ${{ secrets.DISCORD_MENCION }}   # opcional; si no existe usa la del script
        run: python3 vigilar_cupos.py

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado_cupos.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el estado"
            exit 0
          fi
          git commit -m "Actualizar estado de cupos"
          git pull --rebase --autostash || true
          git push
